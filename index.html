<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Anna i Konrad Olesiewicz</title>

  <meta name="description"
        content="Anna Olesiewicz – psychoterapia dorosłych i par. Konrad Olesiewicz – Internal Family Systems (IFS), wsparcie osób dorosłych.">

  <style>
    :root {
      --ink:#20262d;
      --muted:#6e7175;
      --line:#dedbd5;
      --paper:#fbfaf7;
      --anna:#b9796c;
      --konrad:#637f99;
      --gap:clamp(32px,4vw,52px);
    }

    * {
      box-sizing:border-box;
    }

    html,body {
      margin:0;
      min-height:100%;
    }

    body {
      background:var(--paper);
      color:var(--ink);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,
                  "Segoe UI",sans-serif;
    }

    /* =========================
       DESKTOP
       ========================= */

    main {
      min-height:100vh;
      max-width:820px;
      margin:auto;
      padding:clamp(20px,2.5vw,32px);

      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);

      grid-template-rows:
        auto
        auto
        52px
        46px
        auto;

      column-gap:var(--gap);
      align-content:center;
      position:relative;
    }

    .profile {
      display:contents;
    }

    /* pionowy separator */
    main::after {
      content:"";
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:1px;
      height:min(70vh,560px);
      background:var(--line);
      pointer-events:none;
    }

    .portrait-wrap {
      width:min(100%,285px);
      aspect-ratio:1/1;
      overflow:hidden;
      justify-self:center;
      grid-row:1;
    }

    .anna .portrait-wrap {
      grid-column:1;
    }

    .konrad .portrait-wrap {
      grid-column:2;
    }

    .portrait {
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center;
      display:block;
    }

    .anna .portrait {
      object-position:center 38%;
    }

    h1 {
      margin:14px 0 6px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(29px,2.55vw,38px);
      line-height:1;
      font-weight:400;
      letter-spacing:-.025em;
      white-space:nowrap;
      text-align:center;
      align-self:start;
      grid-row:2;
    }

    .anna h1 {
      grid-column:1;
    }

    .konrad h1 {
      grid-column:2;
    }

    .credential {
      margin:0;
      padding-top:3px;

      font-size:clamp(14px,1.1vw,17px);
      font-weight:600;
      line-height:1.35;
      text-align:center;

      display:flex;
      justify-content:center;
      align-items:flex-start;

      grid-row:3;
    }

    .anna .credential {
      grid-column:1;
    }

    .konrad .credential {
      grid-column:2;
    }

    .details {
      margin:0;
      color:var(--muted);

      font-size:clamp(15px,1.2vw,18px);
      line-height:1.45;
      text-align:center;

      display:flex;
      justify-content:center;
      align-items:flex-start;

      grid-row:4;
    }

    .anna .details {
      grid-column:1;
    }

    .konrad .details {
      grid-column:2;
    }

    .button {
      width:min(100%,250px);
      min-height:44px;

      display:flex;
      justify-content:center;
      align-items:center;
      gap:16px;

      justify-self:center;
      align-self:start;

      padding:11px 18px;
      margin-top:12px;

      border-radius:999px;

      color:#fff;
      text-decoration:none;

      font-size:clamp(13px,1vw,16px);
      font-weight:600;
      letter-spacing:.005em;

      transition:transform .18s ease, opacity .18s ease;

      grid-row:5;
    }

    .button:hover {
      transform:translateY(-2px);
      opacity:.92;
    }

    .anna .button {
      grid-column:1;
      background:var(--anna);
    }

    .konrad .button {
      grid-column:2;
      background:var(--konrad);
    }

    .arrow {
      font-size:1.35em;
      line-height:1;
      font-weight:400;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width:700px) {

      body {
        min-height:100svh;
      }

      main {
        width:100%;
        min-height:100svh;

        padding:
          max(18px, env(safe-area-inset-top))
          14px
          max(18px, env(safe-area-inset-bottom));

        display:grid;

        grid-template-columns:
          minmax(0,1fr)
          minmax(0,1fr);

        grid-template-rows:
          auto
          auto
          64px
          42px
          auto;

        column-gap:20px;

        align-content:center;
      }

      /* separator pomiędzy Anną i Konradem */
      main::after {
        display:block;
        top:50%;
        bottom:auto;
        left:50%;
        height:92%;
        transform:translate(-50%,-50%);
      }

      .profile {
        display:contents;
      }

      .portrait-wrap {
        width:100%;
        max-width:220px;
        aspect-ratio:1/1;

        grid-row:1;
      }

      .anna .portrait-wrap {
        grid-column:1;
      }

      .konrad .portrait-wrap {
        grid-column:2;
      }

      .anna .portrait {
        object-position:center 38%;
      }

      .konrad .portrait {
        object-position:center;
      }

      h1 {
        margin:11px 0 7px;

        font-size:clamp(21px,6vw,28px);
        line-height:1.05;
        letter-spacing:-.03em;

        white-space:normal;

        grid-row:2;
      }

      .anna h1 {
        grid-column:1;
      }

      .konrad h1 {
        grid-column:2;
      }

      .credential {
        padding:0 3px;

        font-size:clamp(11px,3.25vw,14px);
        line-height:1.25;
        font-weight:650;

        display:flex;
        align-items:flex-start;
        justify-content:center;

        grid-row:3;
      }

      .anna .credential {
        grid-column:1;
      }

      .konrad .credential {
        grid-column:2;
      }

      .details {
        padding:0 3px;

        font-size:clamp(11px,3vw,13px);
        line-height:1.3;

        display:flex;
        align-items:flex-start;
        justify-content:center;

        grid-row:4;
      }

      .anna .details {
        grid-column:1;
      }

      .konrad .details {
        grid-column:2;
      }

      .button {
        width:100%;
        max-width:210px;
        min-height:42px;

        margin-top:8px;
        padding:9px 10px;

        gap:7px;

        border-radius:999px;

        font-size:clamp(11px,3vw,13px);
        font-weight:650;

        white-space:nowrap;

        grid-row:5;
      }

      .anna .button {
        grid-column:1;
      }

      .konrad .button {
        grid-column:2;
      }

      .arrow {
        font-size:1.25em;
      }
    }


    /* =========================
       BARDZO WĄSKIE TELEFONY
       ========================= */

    @media (max-width:390px) {

      main {
        padding-left:10px;
        padding-right:10px;
        column-gap:14px;
      }

      h1 {
        font-size:20px;
      }

      .credential {
        font-size:11px;
      }

      .details {
        font-size:10.5px;
      }

      .button {
        font-size:10.5px;
        padding-left:7px;
        padding-right:7px;
        gap:5px;
      }
    }

  </style>
</head>


<body>

<main>

  <!-- ANNA -->

  <section class="profile anna">

    <div class="portrait-wrap">
      <img
        class="portrait"
        src="assets/anna-olesiewicz.jpg"
        alt="Anna Olesiewicz">
    </div>

    <h1>Anna Olesiewicz</h1>

    <p class="credential">
      Certyfikowana psychoterapeutka
    </p>

    <p class="details">
      Psychoterapia dorosłych i par (EFT)
    </p>

    <a
      class="button"
      href="https://anna.olesiewicz.pl/"
      aria-label="Przejdź na stronę Anny Olesiewicz">

      <span>anna.olesiewicz.pl</span>
      <span class="arrow">→</span>

    </a>

  </section>


  <!-- KONRAD -->

  <section class="profile konrad">

    <div class="portrait-wrap">
      <img
        class="portrait"
        src="assets/konrad-olesiewicz.jpg"
        alt="Konrad Olesiewicz">
    </div>

    <h1>Konrad Olesiewicz</h1>

    <p class="credential">
      Certyfikowany Praktyk Internal Family Systems
    </p>

    <p class="details">
      Wsparcie osób dorosłych (IFS)
    </p>

    <a
      class="button"
      href="https://konrad.olesiewicz.pl/"
      aria-label="Przejdź na stronę Konrada Olesiewicza">

      <span>konrad.olesiewicz.pl</span>
      <span class="arrow">→</span>

    </a>

  </section>

</main>

</body>
</html>
