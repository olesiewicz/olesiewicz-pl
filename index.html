<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anna i Konrad Olesiewicz</title>
  <meta name="description" content="Anna Olesiewicz – psychoterapia dorosłych i par. Konrad Olesiewicz – Internal Family Systems (IFS), wsparcie osób dorosłych.">
  <style>
    :root {
      --ink:#20262d; --muted:#6e7175; --line:#dedbd5; --paper:#fbfaf7;
      --anna:#b9796c; --konrad:#637f99;
      --gap:clamp(32px,4vw,52px);
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { background:var(--paper); color:var(--ink); font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main {
      min-height:100vh;
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      max-width:820px;
      margin:auto;
      padding:clamp(20px,2.5vw,32px);
      align-content:center;
      gap:var(--gap);
    }
    .profile {
      position:relative;
      display:grid;
      grid-template-rows:auto auto auto auto auto;
      align-items:start;
      justify-items:center;
      text-align:center;
      min-width:0;
    }
    /* Divider sits in the middle of the gap and no longer steals width from Konrad's column. */
    .profile + .profile::before {
      content:"";
      position:absolute;
      top:0; bottom:0;
      left:calc(var(--gap) / -2);
      width:1px;
      background:var(--line);
    }
    .portrait-wrap {
      width:min(100%,285px);
      aspect-ratio:1/1;
      overflow:hidden;
    }
    .portrait { width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
    .anna .portrait { object-position:center 38%; }
    .konrad .portrait { object-position:center; }
    h1 {
      margin:14px 0 6px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(29px,2.55vw,38px);
      line-height:1;
      font-weight:400;
      letter-spacing:-.025em;
      white-space:nowrap;
    }
    .credential { margin:0; font-size:clamp(14px,1.1vw,17px); font-weight:600; line-height:1.35; }
    .details { margin:8px 0 0; color:var(--muted); font-size:clamp(13px,1vw,16px); line-height:1.45; align-self:start; }
    .button {
      width:min(100%,250px);
      display:flex;
      justify-content:center;
      align-items:center;
      gap:18px;
      padding:11px 18px;
      border-radius:999px;
      color:#fff;
      text-decoration:none;
      font-size:clamp(13px,1vw,16px);
      transition:transform .18s ease, opacity .18s ease;
      align-self:start;
      margin-top:24px;
    }
    .button:hover { transform:translateY(-2px); opacity:.92; }
    .anna .button { background:var(--anna); }
    .konrad .button { background:var(--konrad); }
    .arrow { font-size:1.35em; font-weight:300; }
    @media (max-width:800px) {
      main { grid-template-columns:1fr; padding:24px 20px 42px; gap:46px; }
      .profile { display:flex; flex-direction:column; align-items:center; }
      .profile + .profile { border-top:1px solid var(--line); padding-top:46px; }
      .profile + .profile::before { display:none; }
      .portrait-wrap { width:min(100%,520px); }
      h1 { white-space:normal; }
      .button { margin-top:28px; }
    }
  </style>
</head>
<body>
<main>
  <section class="profile anna">
    <div class="portrait-wrap"><img class="portrait" src="assets/anna-olesiewicz.jpg" alt="Anna Olesiewicz"></div>
    <h1>Anna Olesiewicz</h1>
    <p class="credential">Certyfikowana psychoterapeutka</p>
    <p class="details">Psychoterapia dorosłych i par (EFT)</p>
    <a class="button" href="https://anna.olesiewicz.pl/" aria-label="Przejdź na stronę Anny Olesiewicz">anna.olesiewicz.pl <span class="arrow">→</span></a>
  </section>

  <section class="profile konrad">
    <div class="portrait-wrap"><img class="portrait" src="assets/konrad-olesiewicz.jpg" alt="Konrad Olesiewicz"></div>
    <h1>Konrad Olesiewicz</h1>
    <p class="credential">Certyfikowany Praktyk Internal Family Systems (IFS)</p>
    <p class="details">Wsparcie osób dorosłych</p>
    <a class="button" href="https://konrad.olesiewicz.pl/" aria-label="Przejdź na stronę Konrada Olesiewicza">konrad.olesiewicz.pl <span class="arrow">→</span></a>
  </section>
</main>
</body>
</html>
